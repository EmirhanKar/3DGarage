name: _3dgarage
description: "3DGarage - 3D Car Tuning Studio"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  tflite_flutter: ^0.12.1
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  mime: ^2.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  model_viewer_plus: ^1.10.0
  sensors_plus: ^6.1.1

  # Firebase & Bildirim
  firebase_core: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/LOGO101.png
    - assets/onboarding/
    - assets/jantlar/
    - assets/spoilers/

# flutter_launcher_icons flutter: bloğunun DIŞINDA olmalı
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/launcher_icon.png"
  min_sdk_android: 21
  web:
    generate: false
